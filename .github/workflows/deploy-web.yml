name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install consumer dependencies
        run: npm ci

      - name: Build consumer web app
        run: EXPO_PUBLIC_BASE_PATH=/1 npm run build:web

      - name: Stage consumer artifact
        run: |
          mkdir -p pages-dist
          cp -R dist/. pages-dist/

      - name: Install merchant dependencies
        working-directory: merchant-app
        run: npm ci

      - name: Build merchant web app
        working-directory: merchant-app
        run: EXPO_PUBLIC_BASE_PATH=/1/merchant npm run build:web

      - name: Merge merchant into Pages artifact
        run: |
          mkdir -p pages-dist/merchant
          cp -R merchant-app/dist/. pages-dist/merchant/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
